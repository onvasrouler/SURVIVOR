name: Test and Lint

on:
  push:
    branches:
      - 'main'

jobs:
  check_commit_name: # job ok
    name: Check commit name
    runs-on: ubuntu-latest
    steps:
        - name: Check commit name
          id: check_commit_name
          uses: actions/checkout@v3
        - name: Run Check commit name
          run: |
            COMMIT_NAME=$(git log --format=%s -n 1)
            if [[ ! $COMMIT_NAME =~ ^:[a-z_]+: ]]; then
              echo "::error title=Invalid commit name::Commit name must start with a gitmoji"
              exit 1
            fi
  
  test-flutter-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

        
      - name: Setup Flutter
        uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter_version: '2.10.0'
        
        

      - name: Test Flutter build
        uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter_version: '2.10.0'
          flutter_root: 'client'
  
  tes-node-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: |
          cd server
          npm install
          cd ..
        
      - name: Lint server code
        run: |
          cd server
          npm run lint

  Repository_Mirroring:
    runs-on: ubuntu-latest
    needs:
        - check_program_compilation
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            ${{ env.MIRROR_URL }}
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
