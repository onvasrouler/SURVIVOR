name: Test and Lint

on:
  push:
    branches:
      - 'main'

jobs:
  generate-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v3"
        with:
          fetch-depth: 0 # Required for fetch all history

      - name: "Generate Changelog"
        uses: sercanuste/gitmoji-changelog-action@v1

  test-flutter-build:
    runs-on: ubuntu-latest
    needs:
        - generate-changelog
    steps:
      - name: Checkout code
        uses: actions/checkout@v2


      - name: Setup Flutter
        uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter_version: '2.10.0'

      - name: Test Flutter build
        uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter_version: '2.10.0'
          flutter_root: 'client'


  Repository_Mirroring:
    runs-on: ubuntu-latest
    needs:
        - test-flutter-build
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            git@github.com:EpitechPromo2027/B-SVR-500-NAN-5-1-survivor-aimeric.rouyer.git
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
