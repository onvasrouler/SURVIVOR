name: Test and Lint

on:
  push:
    branches:
      - 'main'

jobs:
  check_commit_name:
    name: Check commit name
    runs-on: ubuntu-latest
    steps:
        - name: Check commit name
          id: check_commit_name
          uses: actions/checkout@v3

  test-flutter-build:
    runs-on: ubuntu-latest
    needs:
        - check_commit_name
    steps:
      - name: Checkout code
        uses: actions/checkout@v2


      - name: Setup Flutter
        uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter_version: '2.10.0'

      - name: Test Flutter build
        uses: subosito/flutter-action@v1
        with:
          channel: 'stable'
          flutter_version: '2.10.0'
          flutter_root: 'client'

  test-node-lint:
    runs-on: ubuntu-latest
    needs:
        - check_commit_name
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: |
          cd server
          npm install
          cd ..

      - name: Lint server code
        run: |
          cd server
          npm run lint

  Repository_Mirroring:
    runs-on: ubuntu-latest
    needs:
        - test-flutter-build
        - test-node-lint
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            ${{ env.MIRROR_URL }}
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
